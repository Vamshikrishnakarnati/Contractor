	<style>
		.form-box{display: none;}
	</style>
	<script>
		$(document).ready(function(){
			$("select").change(function(){
				$(this).find("option:selected").each(function(){
					var optionValue = $(this).attr("value");
					if(optionValue){
						$(".form-box").not("." + optionValue).hide();
						$("." + optionValue).show();
					} else{
						$(".form-box").hide();
					}
				});
			}).change();
		});
	</script>
