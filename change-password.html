<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Contracktor</title>
    <meta name="description" content="">
    <meta name="keywords" content=""/>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icon/192x192.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- loader -->
    <div id="loader">
        <img src="assets/img/logo-icon.png" alt="icon" class="loading-icon">
    </div>
    <!-- * loader -->
	
	<!-- App Header -->
    <div class="appHeader bg-primary text-light">
        <div class="left">
            <a href="#" class="headerButton goBack">
                <ion-icon name="arrow-back-sharp"></ion-icon>
            </a>
        </div>
        <div class="pageTitle">
           Change Password
        </div>
        <div class="right">
        </div>
    </div>
    <!-- * App Header -->

    <!-- App Capsule -->
    <div id="appCapsule">
		<div class="section mt-2">
			<div class="card">
                <div class="card-body">
                    <form>
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="oldpassword">Old Password</label>
                                <input type="password" class="form-control" id="oldpassword" placeholder="Enter Old Password"/>
                                <i class="clear-input">
                                    <ion-icon name="close-circle"></ion-icon>
                                </i>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="newpassword">New Password</label>
                                <input type="password" class="form-control" id="newpassword" placeholder="Enter New Password"/>
                                <i class="clear-input">
                                    <ion-icon name="close-circle"></ion-icon>
                                </i>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="confirmpassword">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmpassword" placeholder="Enter Confirm Password"/>
                                <i class="clear-input">
                                    <ion-icon name="close-circle"></ion-icon>
                                </i>
                            </div>
                        </div>
                     
						<div class="form-button-group transparent mt-4">
							<button type="submit" class="btn btn-primary btn-block rounded-pill">Update Password <ion-icon name="arrow-forward-sharp" class="fs-6 align-middle ms-1 me-0 mt-0"></ion-icon></button>
						</div>
                    </form>

                </div>
            </div>
		</div>
    </div>
    <!-- * App Capsule -->



    <!-- ========= JS Files =========  -->
	<!-- jquery.min -->
    <script src="assets/js/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="assets/js/lib/bootstrap.bundle.min.js"></script>
    <!-- Ionicons -->
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
    <!-- Splide -->
    <script src="assets/js/plugins/splide/splide.min.js"></script>
    <!-- Base Js File -->
    <script src="assets/js/base.js"></script>

</body>
</html>
