<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Contracktor</title>
    <meta name="description" content="">
    <meta name="keywords" content=""/>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icon/192x192.png">
	<!-- duDatepicker -->
    <link rel="stylesheet" href="assets/css/src/duDatepicker/duDatepicker.min.css"/>
    <link rel="stylesheet" href="assets/css/src/duDatepicker/duDatepicker-theme.css"/>
	<!-- Mdtime Picker -->
    <link rel="stylesheet" href="assets/css/src/mdtime-picker/mdtimepicker.min.css"/>
	
    <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>

    <!-- loader -->
    <div id="loader">
        <img src="assets/img/logo-icon.png" alt="icon" class="loading-icon">
    </div>
    <!-- * loader -->
	
	<!-- App Header -->
    <div class="appHeader bg-primary text-light">
        <div class="left">
            <a href="#" class="headerButton goBack">
                <ion-icon name="arrow-back-sharp"></ion-icon>
            </a>
        </div>
        <div class="pageTitle">
           Generate Work Orders
        </div>
        <div class="right">
        </div>
    </div>
    <!-- * App Header -->

    <!-- App Capsule -->
    <div id="appCapsule">
		<div class="section mt-2">
			<div class="card">
                <div class="card-body">
                    <form>
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="won">Work Order Number</label>
                                <input type="text" class="form-control" id="won" placeholder="Work Order Number" value=""/>
                                <i class="clear-input">
                                    <ion-icon name="close-circle"></ion-icon>
                                </i>
                            </div>
                        </div>

                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="wd">Work Description</label>
                                <input type="text" class="form-control" id="wd" placeholder="Work Description" value=""/>
                                <i class="clear-input">
                                    <ion-icon name="close-circle"></ion-icon>
                                </i>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="nameContractor">Name of Contractor</label>
								<select class="form-select">
									<option>MS Imfra</option>
									<option>AV Imfra</option>
									<option>MC Group</option>
								</select>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="department">Department</label>
								<select class="form-select">
									<option selected>Select Department</option>
									<option>AV Imfra</option>
									<option>MC Group</option>
								</select>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="typecontract">Type of contract</label>
								<select class="form-select">
									<option selected>Select Contract Type</option>
									<option>S</option>
									<option>BBBBB</option>
								</select>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="areaContract">Area of Contract</label>
								<select class="form-select">
									<option>Select Area of Contract</option>
									<option selected>Operations</option>
								</select>
                            </div>
                        </div>
						
						<h6 class="mb-0">Period of Contract</h6>
						<div class="row">
							<div class="col-6">
								<div class="form-group basic">
									<div class="input-wrapper">
										<label class="label" for="sd">Start Date</label>
										<input type="text" class="form-control datepicker form-date" id="sd" placeholder="Start Date" value=""/>
									</div>
								</div>
							</div>
							<div class="col-6">
								<div class="form-group basic">
									<div class="input-wrapper">
										<label class="label" for="ed">End Date</label>
										<input type="text" class="form-control datepicker form-date" id="ed" placeholder="End Date" value=""/>
									</div>
								</div>
							</div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="oap">Ops Authorised Person</label>
								<select class="form-select">
									<option selected>Select Ops Authorised Person</option>
									<option>Operations</option>
								</select>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="sap">Safety Authorised Person</label>
								<select class="form-select">
									<option selected>Select Safety Authorised Person</option>
									<option>Safety</option>
								</select>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="hrap">HR Authorised person</label>
								<select class="form-select">
									<option selected>Select HR Authorised Person</option>
									<option>Authorised</option>
								</select>
                            </div>
                        </div>
						
                        <div class="form-group basic">
                            <div class="input-wrapper">
                                <label class="label" for="vap">Vigilance Authorised person</label>
								<select class="form-select">
									<option selected>Select Vigilance Authorised Person</option>
									<option>Vigilance</option>
								</select>
                            </div>
                        </div>
						
						<div class="form-button-group transparent mt-4">
							<button type="submit" class="btn btn-primary btn-block rounded-pill">Submit <ion-icon name="arrow-forward-sharp" class="fs-6 align-middle ms-1 me-0 mt-0"></ion-icon></button>
						</div>
                    </form>

                </div>
            </div>
		</div>
    </div>
    <!-- * App Capsule -->



    <!-- ========= JS Files =========  -->
	<!-- jquery.min -->
    <script src="assets/js/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="assets/js/lib/bootstrap.bundle.min.js"></script>
    <!-- Ionicons -->
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
    <!-- Splide -->
    <script src="assets/js/plugins/splide/splide.min.js"></script>
	<!-- Mdtime Picker -->
	<script src="assets/js/plugins/mdtime-picker/mdtimepicker.min.js"></script>
	<!-- duDatepicker -->
	<script src="assets/js/plugins/duDatepicker/duDatepicker.min.js"></script>
    <!-- Base Js File -->
    <script src="assets/js/base.js"></script>
    <script>			
		$(document).ready(function () {
			$('.datepicker').duDatepicker({
				format: 'mmm d, yyyy', 
				range: false,
			});
		});
	</script>
	
</body>
</html>
