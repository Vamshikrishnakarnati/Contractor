<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Contracktor</title>
    <meta name="description" content="">
    <meta name="keywords" content=""/>
    <link rel="icon" type="image/png" href="assets/img/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icon/192x192.png">
	<!-- chartist -->
    <link rel="stylesheet" href="assets/css/src/chartist/chartist.min.css"/>
    <link rel="stylesheet" href="assets/css/src/chartist/chartist-init.css"/>
    <link rel="stylesheet" href="assets/css/src/chartist/chartist-plugin-tooltip.css"/>
	<!-- duDatepicker -->
    <link rel="stylesheet" href="assets/css/src/duDatepicker/duDatepicker.min.css"/>
    <link rel="stylesheet" href="assets/css/src/duDatepicker/duDatepicker-theme.css"/>
	<!-- Mdtime Picker -->
    <link rel="stylesheet" href="assets/css/src/mdtime-picker/mdtimepicker.min.css"/>
	
    <link rel="stylesheet" href="assets/css/style.css"/>
</head>

<body>

    <!-- loader -->
    <div id="loader">
        <img src="assets/img/logo-icon.png" alt="icon" class="loading-icon">
    </div>
    <!-- * loader -->

    <!-- App Header -->
    <div class="appHeader bg-primary text-light">
        <div class="left">
            <a href="#" class="headerButton goBack">
                <ion-icon name="arrow-back-sharp"></ion-icon>
            </a>
        </div>
        <div class="pageTitle">
            Customize Reports
        </div>
        <div class="right">
            <a href="javascript:void(0);" class="headerButton filter-btn">
                <ion-icon class="icon" name="options-outline"></ion-icon>
            </a>
			<a href="javascript:void(0);" class="headerButton filter-close"><ion-icon name="close-outline"></ion-icon></a>
        </div>
    </div>
    <!-- * App Header -->


    <!-- App Capsule -->
    <div id="appCapsule">
        <div class="section full mb-2 sticky-top" style="top: 56px;">
            <div class="card mb-2 rounded-0 filter-box">
				<div class="card-body">
					<form>
						<div class="row">
							<div class="col-12">
								<div class="form-group basic pt-0 small-size">
									<div class="input-wrapper">
										<select class="form-select">
											<option selected>Select Department</option>
											<option>CRM</option>
											<option>SMS</option>
										</select>
									</div>
								</div>
							</div>
						</div>
						<div class="row">
							<div class="col-6">
								<div class="form-group basic pt-0 small-size">
									<div class="input-wrapper">
										<input type="text" class="form-control datepicker form-date" id="sd" placeholder="Start Date" value=""/>
									</div>
								</div>
							</div>
							<div class="col-6">
								<div class="form-group basic pt-0 small-size">
									<div class="input-wrapper">
										<input type="text" class="form-control datepicker form-date" id="ed" placeholder="End Date" value=""/>
									</div>
								</div>
							</div>
						</div>
						<div class="text-center">
							<button type="submit" class="btn btn-primary btn-sm px-3 rounded-pill">Submit</button>
						</div>
					</form>
				</div>
			</div>
        </div>
		<div class="section mt-2 mb-2">
			<div class="card">
				<div class="card-body ps-0">
					<h5 class="card-title ps-2">Work Orders Being Evaluated</h5>
					<div class="ct-wobe-chart" style="height: 250px;"></div>
					<div class="text-center ps-2"><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#7460ee;margin-right:5px;"></span>YTD</span><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#f05b4f;margin-right:5px;"></span>Active</span><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#26c6da;margin-right:5px;"></span>New During The Month</span></div>
				</div>
			</div>
		</div>
		<div class="section mb-2">
			<div class="card">
				<div class="card-body ps-0">
					<h5 class="card-title ps-2">Rating Of All Work Order</h5>
					<div class="ct-rawo-chart" style="height: 250px;"></div>
					<div class="text-center ps-2"><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#7460ee;margin-right:5px;"></span>YTD</span><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#f05b4f;margin-right:5px;"></span>Active</span><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#26c6da;margin-right:5px;"></span>During the month</span></div>
				</div>
			</div>
		</div>
		<div class="section mb-2">
			<div class="card">
				<div class="card-body ps-0">
					<h5 class="card-title ps-2">Department wise Rating evaluation</h5>
					<div class="ct-fwre-chart" style="height: 250px;"></div>
					<div class="text-center ps-2"><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#7460ee;margin-right:5px;"></span>Ops</span><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#f05b4f;margin-right:5px;"></span>Safety</span><span class="me-1 d-inline-block align-middle"><span style="width:10px;height:10px;display:inline-block;background:#26c6da;margin-right:5px;"></span>Compliance</span></div>
				</div>
			</div>
		</div>
    </div>
    <!-- * App Capsule -->
   

    <!-- ========= JS Files =========  -->
	<!-- jquery.min -->
    <script src="assets/js/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="assets/js/lib/bootstrap.bundle.min.js"></script>
    <!-- Ionicons -->
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
    <!-- Splide -->
    <script src="assets/js/plugins/splide/splide.min.js"></script>
	<!-- chartist -->
    <script src="assets/js/plugins/chartist/chartist.min.js"></script>
    <script src="assets/js/plugins/chartist/chartist-plugin-tooltip.js"></script>
	<!-- Mdtime Picker -->
	<script src="assets/js/plugins/mdtime-picker/mdtimepicker.min.js"></script>
	<!-- duDatepicker -->
	<script src="assets/js/plugins/duDatepicker/duDatepicker.min.js"></script>
    <!-- Base Js File -->
    <script src="assets/js/base.js"></script>
	
    <script>
		$('.filter-btn').on('click', function() {
			$('body').find('.filter-box').addClass('show-filter');
			$(this).hide();
			$('.filter-close').show();
		});
		$('.filter-close').hide();
		$('.filter-close').on('click', function() {
			$('body').find('.filter-box').removeClass('show-filter');
			$(this).hide();
			$('.filter-btn').show();
		});
		$(document).ready(function () {
			$('.datepicker').duDatepicker({
				format: 'mmm d, yyyy', 
				range: false,
			});
		});
		
		// chat 1
		var chart = new Chartist.Bar('.ct-wobe-chart', {
		  labels: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'],
		  series: [
			[3, 4, 8, 10, 6, 8],
			[4, 6, 7, 8, 7, 4],
			[4, 6, 7, 8, 7, 4]
		  ]
		}, {
		  seriesBarDistance: 11,
		  plugins: [
			Chartist.plugins.tooltip()
		  ],
		});
		
		// chat 2
		var chart = new Chartist.Bar('.ct-rawo-chart', {
		  labels: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'],
		  series: [
			[4, 6, 7, 8, 7, 4],
			[3, 4, 8, 9, 6, 8],
			[4, 6, 7, 8, 7, 4]
		  ]
		}, {
		  seriesBarDistance: 11,
		  plugins: [
			Chartist.plugins.tooltip()
		  ],
		});

		// chat 3
		var chart = new Chartist.Line('.ct-fwre-chart', {
		  labels: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'],
		  series: [
			[1, 5, 2, 5, 9, 8],
			[2, 3, 4, 8, 1, 2],
			[5, 4, 3, 2, 1, 0.5]
		  ]
		}, {
		  low: 0,
		  showArea: true,
		  showPoint: true,
		  fullWidth: true,
		  plugins: [
			Chartist.plugins.tooltip()
		  ],
		  chartPadding: {
			right: 20
		  }
		});

		chart.on('draw', function(data) {
		  if(data.type === 'line' || data.type === 'area') {
			data.element.animate({
			  d: {
				begin: 2000 * data.index,
				dur: 2000,
				from: data.path.clone().scale(1, 0).translate(0, data.chartRect.height()).stringify(),
				to: data.path.clone().stringify(),
				easing: Chartist.Svg.Easing.easeOutQuint
			  }
			});
		  }
		});
    </script>

</body>
</html>
